<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    rect.bg { fill: #ffffff; }
    rect.fg { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      rect.bg { fill: #000000; }
      rect.fg { fill: #ffffff; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="24" height="24" />
  <!-- Capital T placeholder. Solid geometric shape until the real mark lands. -->
  <rect class="fg" x="3" y="4" width="18" height="4" />
  <rect class="fg" x="10" y="4" width="4" height="16" />
</svg>
