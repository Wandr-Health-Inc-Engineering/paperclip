<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- tethr's mark: the "working" nebula. Two soft spiral arms around a bright
       core, three motes on faint tilted orbits, bone on Night ink. The PNG
       favicons come from scripts/tethr-icon/make-icon.swift in the same style. -->
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.7" />
    </filter>
    <radialGradient id="haze">
      <stop offset="0" stop-color="#e9e7e3" stop-opacity="0.22" />
      <stop offset="1" stop-color="#e9e7e3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.35" stop-color="#e9e7e3" stop-opacity="0.75" />
      <stop offset="1" stop-color="#e9e7e3" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0a09" />
  <circle cx="32" cy="32" r="22" fill="url(#haze)" />
  <g filter="url(#soft)" fill="none" stroke="#e9e7e3" stroke-linecap="round">
    <path d="M32 32 C 36 25, 46 24, 48.5 32 C 50.5 39, 46 45.5, 39.5 47" stroke-width="5.5" stroke-opacity="0.6" />
    <path d="M32 32 C 36 25, 46 24, 48.5 32 C 50.5 39, 46 45.5, 39.5 47" stroke-width="5" stroke-opacity="0.45" transform="rotate(180 32 32)" />
  </g>
  <g fill="none" stroke="#e9e7e3" stroke-opacity="0.13" stroke-width="0.7">
    <ellipse cx="32" cy="32" rx="19" ry="8.5" transform="rotate(24 32 32)" />
    <ellipse cx="32" cy="32" rx="13.5" ry="8" transform="rotate(-38 32 32)" />
  </g>
  <circle cx="32" cy="32" r="8" fill="url(#core)" />
  <circle cx="32" cy="32" r="2.4" fill="#ffffff" />
  <circle cx="14.6" cy="24.3" r="1.6" fill="#e9e7e3" />
  <circle cx="41.7" cy="40.8" r="1.3" fill="#e9e7e3" />
  <circle cx="47.5" cy="45.5" r="1" fill="#e9e7e3" fill-opacity="0.7" />
</svg>
