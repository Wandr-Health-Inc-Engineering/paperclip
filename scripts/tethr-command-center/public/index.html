<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tethr · Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'><rect x='3' y='3' width='18' height='18'/><line x1='3' y1='9' x2='21' y2='9'/></svg>" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-name">TETHR</span>
      <span class="brand-sub">Command Center</span>
    </div>
    <div class="path" id="rootPath">00 Tethr</div>
    <div class="actions">
      <button class="btn" id="btnNewFolder" title="New folder">+ Folder</button>
      <button class="btn" id="btnRefresh" title="Refresh">Refresh</button>
    </div>
  </header>

  <main class="body">
    <aside class="sidebar" id="tree"></aside>
    <section class="reader" id="reader">
      <div class="empty" id="emptyState">
        <p>Select a file on the left to read it.</p>
        <p class="muted">Markdown renders here. Use the toolbar to rename, move, or archive.</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
</div>

<!-- dialog -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">Title</h3>
      <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalConfirm">OK</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
